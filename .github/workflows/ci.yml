---
name: Test and release MKP

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python3 -m pip install 'requests>=2.31,<3'
      - name: Install lint dependencies
        run: python3 -m pip install ruff==0.17.4 yamllint==1.38.0
      - name: Lint Python
        run: >-
          python3 -m ruff check --isolated --target-version py311
          --select E4,E7,E9,F
          --config 'extend-include = ["**/libexec/agent_*"]' .
      - name: Lint YAML
        run: >-
          yamllint -d
          '{extends: default,
          ignore: [".git/", ".venv/", ".ansible/", "dist/"]}' .
      - name: Run offline tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Build MKP
        run: python3 -B build_mkp.py
      - name: Upload validated MKP
        uses: actions/upload-artifact@v4
        with:
          name: check_fortisase-mkp
          path: check_fortisase-*.mkp
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mkp-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine release version
        id: version
        shell: bash
        run: |
          git fetch --tags origin
          version=$(python3 -B .github/scripts/release_version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build versioned MKP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 -B build_mkp.py --version "$VERSION"
      - name: Publish Git tag and release with MKP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          package="check_fortisase-$VERSION.mkp"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$package" --clobber
          else
            gh release create "$tag" "$package" \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
